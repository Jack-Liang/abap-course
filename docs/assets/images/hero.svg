<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" role="img" aria-label="ABAP 编辑器窗口输出 Hello, ABAP!，一架航班沿虚线航迹起飞">
  <!-- 背景光晕 -->
  <circle cx="300" cy="205" r="168" fill="#0070f2" opacity="0.07"/>
  <circle cx="300" cy="205" r="118" fill="#0070f2" opacity="0.05"/>

  <!-- 虚线航迹 -->
  <path d="M34 332 C 130 306, 208 236, 292 158 C 356 96, 432 72, 508 62" stroke="#f0a500" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12"/>

  <!-- ABAP 编辑器窗口 -->
  <g>
    <rect x="46" y="104" width="336" height="248" rx="14" fill="#101c2c" stroke="#0070f2" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="46" y1="140" x2="382" y2="140" stroke="#0070f2" stroke-opacity="0.25"/>
    <circle cx="68" cy="122" r="5.5" fill="#ff6b6b"/>
    <circle cx="87" cy="122" r="5.5" fill="#ffb84d"/>
    <circle cx="106" cy="122" r="5.5" fill="#4dd07c"/>
    <text x="126" y="127" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7ea6d9">zac_hello_world.abap</text>

    <text x="68" y="172" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9fb8dd">REPORT zac_hello_world.</text>
    <text x="68" y="200" font-family="Consolas, 'Courier New', monospace" font-size="13"><tspan fill="#7cc0f5" font-weight="bold">WRITE</tspan><tspan fill="#c9d7f0"> |</tspan><tspan fill="#ffd479">Hello, ABAP!</tspan><tspan fill="#c9d7f0">|.</tspan></text>

    <!-- 输出区 -->
    <rect x="66" y="272" width="296" height="56" rx="8" fill="#0a1424"/>
    <text x="80" y="296" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#6ee7a0">Hello, ABAP!</text>
    <text x="80" y="315" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#51688a">// program output</text>
  </g>

  <!-- 徽章 -->
  <g>
    <rect x="312" y="76" width="104" height="32" rx="16" fill="#ffffff" stroke="#0070f2" stroke-width="1.5"/>
    <text x="364" y="96" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#0040a0" letter-spacing="1">SFLIGHT</text>

    <rect x="404" y="330" width="128" height="32" rx="16" fill="#0070f2"/>
    <text x="468" y="350" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#ffffff" letter-spacing="1">SE38 · ABAP</text>
  </g>

  <!-- 航班（Material flight，沿航迹方向） -->
  <g transform="translate(506 52) rotate(52)">
    <path d="M21,16V14L13,9V3.5A1.5,1.5 0 0,0 11.5,2A1.5,1.5 0 0,0 10,3.5V9L2,14V16L10,13.5V19L8,20.5V22L11.5,21L15,22V20.5L13,19V13.5L21,16Z" fill="#0070f2"/>
  </g>
</svg>
